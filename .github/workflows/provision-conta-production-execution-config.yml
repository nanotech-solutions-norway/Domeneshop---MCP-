name: Provision Conta production execution metadata fail closed

on:
  pull_request:
    paths:
      - '.github/workflows/provision-conta-production-execution-config.yml'
      - 'scripts/provision_conta_production_execution_config.py'
      - 'tests/test_provision_conta_production_execution_config.py'
  workflow_dispatch:
    inputs:
      authorization:
        description: Type PROVISION_CONTA_EXECUTION_CONFIG_FAIL_CLOSED_A6B94702
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conta-production-execution-metadata-provisioning
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/provision_conta_production_execution_config.py
      - run: python -m unittest tests/test_provision_conta_production_execution_config.py
      - shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PROVISION_CONTA_EXECUTION_CONFIG_FAIL_CLOSED_A6B94702' scripts/provision_conta_production_execution_config.py
          grep -Fq 'PROVIDER_CALL_PERFORMED=false' scripts/provision_conta_production_execution_config.py
          grep -Fq 'PRODUCTION_MUTATION_PERFORMED=false' scripts/provision_conta_production_execution_config.py
          grep -Fq 'KILL_SWITCH_GLOBAL_BLOCKED=true' scripts/provision_conta_production_execution_config.py
          ! grep -Eq 'api\.gateway\.conta(-sandbox)?\.no' scripts/provision_conta_production_execution_config.py
          echo 'STATIC_FAIL_CLOSED_VALIDATION=true'

  provision:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: domeneshop-readonly-validation
    env:
      PROVISION_AUTHORIZATION: ${{ inputs.authorization }}
      DS_SFTP_USER: ${{ secrets.DS_SFTP_USER }}
      DS_SFTP_VALUE: ${{ secrets.DS_SFTP_VALUE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'paramiko==5.0.0'
      - shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == 'main' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]]
          [[ "$PROVISION_AUTHORIZATION" == 'PROVISION_CONTA_EXECUTION_CONFIG_FAIL_CLOSED_A6B94702' ]]
          [[ -n "${DS_SFTP_USER:-}" ]]
          [[ -n "${DS_SFTP_VALUE:-}" ]]
          python scripts/provision_conta_production_execution_config.py
