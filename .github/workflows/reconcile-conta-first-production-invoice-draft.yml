name: Reconcile Conta first-production invoice draft GET only

on:
  pull_request:
    paths:
      - '.github/workflows/reconcile-conta-first-production-invoice-draft.yml'
      - 'scripts/reconcile_conta_first_production_invoice_draft.py'
      - 'scripts/conta_invoice_draft_duplicate_guard.py'
      - 'tests/test_reconcile_conta_first_production_invoice_draft.py'
  workflow_dispatch:
    inputs:
      authorization:
        description: Type RECONCILE_CONTA_FIRST_PRODUCTION_A6B94702
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conta-first-production-invoice-draft-reconciliation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/reconcile_conta_first_production_invoice_draft.py
      - run: python -m unittest tests/test_reconcile_conta_first_production_invoice_draft.py
      - shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RECONCILE_CONTA_FIRST_PRODUCTION_A6B94702' scripts/reconcile_conta_first_production_invoice_draft.py
          grep -Fq 'PROVIDER_MUTATION_PERFORMED=false' scripts/reconcile_conta_first_production_invoice_draft.py
          grep -Fq 'READBACK_VERIFIED=true' scripts/reconcile_conta_first_production_invoice_draft.py
          ! grep -Eq 'method="(POST|PUT|PATCH|DELETE)"' scripts/reconcile_conta_first_production_invoice_draft.py
          ! grep -Eq "method='(POST|PUT|PATCH|DELETE)'" scripts/reconcile_conta_first_production_invoice_draft.py
          echo 'GET_ONLY_STATIC_VALIDATION=true'

  reconcile:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: domeneshop-readonly-validation
    env:
      RECONCILE_AUTHORIZATION: ${{ inputs.authorization }}
      CONTA_PROD_API_KEY: ${{ secrets.CONTA_PROD_API_KEY }}
      CONTA_PROD_ORG_ID: ${{ secrets.CONTA_PROD_ORG_ID }}
      CONTA_PROD_CUSTOMER_REFERENCE: ${{ secrets.CONTA_PROD_CUSTOMER_REFERENCE }}
      CONTA_PROD_VAT_CODE: ${{ vars.CONTA_PROD_VAT_CODE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'certifi==2026.7.22'
      - shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == 'main' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]]
          [[ "$RECONCILE_AUTHORIZATION" == 'RECONCILE_CONTA_FIRST_PRODUCTION_A6B94702' ]]
          python scripts/reconcile_conta_first_production_invoice_draft.py
