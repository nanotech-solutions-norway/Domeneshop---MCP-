name: Execute authorized Conta first-production invoice draft

on:
  pull_request:
    paths:
      - '.github/workflows/execute-conta-first-production-invoice-draft.yml'
      - 'scripts/execute_conta_first_production_invoice_draft.py'
  workflow_dispatch:
    inputs:
      authorization:
        description: Type EXECUTE_CONTA_FIRST_PRODUCTION_A6B94702
        required: true
        type: string
      decision_packet_sha256:
        description: Fresh repository-safe decision packet SHA-256 from Conta production decision attestation
        required: true
        type: string
      decision_packet_expires_at:
        description: Fresh decision attestation expiry timestamp in UTC
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conta-first-production-invoice-draft
  cancel-in-progress: false

jobs:
  validate:
    name: Validate one-shot production execution controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout execution control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Compile controller
        run: python -m py_compile scripts/execute_conta_first_production_invoice_draft.py

      - name: Verify hard authorization bindings and no direct provider mutation method
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'a6b9470204775598c4f569ea2837c0bc712b0dc3' scripts/execute_conta_first_production_invoice_draft.py
          grep -Fq '19d8b9fd3e7aec7fec7405df2ffec0e72839c9ac' scripts/execute_conta_first_production_invoice_draft.py
          grep -Fq 'EXECUTE_CONTA_FIRST_PRODUCTION_A6B94702' scripts/execute_conta_first_production_invoice_draft.py
          grep -Fq 'workflow_rerun_not_authorized' scripts/execute_conta_first_production_invoice_draft.py
          grep -Fq 'DUPLICATE_STOP_RULE=ZERO_EXISTING_DRAFTS' scripts/execute_conta_first_production_invoice_draft.py
          grep -Fq 'KILL_SWITCH_RE_CLOSED=true' scripts/execute_conta_first_production_invoice_draft.py
          ! grep -Eq 'PROVIDER_BASE.*(POST|PUT|PATCH|DELETE)' scripts/execute_conta_first_production_invoice_draft.py
          echo 'CONTROLLER_STATIC_SAFETY_CHECKS=true'

  execute:
    name: Execute one bounded first-production draft and re-close gates
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: domeneshop-readonly-validation
    env:
      DS_SFTP_USER: ${{ secrets.DS_SFTP_USER }}
      DS_SFTP_VALUE: ${{ secrets.DS_SFTP_VALUE }}
      CONTA_PROD_API_KEY: ${{ secrets.CONTA_PROD_API_KEY }}
      CONTA_PROD_ORG_ID: ${{ secrets.CONTA_PROD_ORG_ID }}
      CONTA_PROD_CUSTOMER_REFERENCE: ${{ secrets.CONTA_PROD_CUSTOMER_REFERENCE }}
      CONTA_PROD_VAT_CODE: ${{ vars.CONTA_PROD_VAT_CODE }}
      CONTA_PROD_INVOICE_DATE: ${{ vars.CONTA_PROD_INVOICE_DATE }}

    steps:
      - name: Checkout exact execution controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Enforce protected inputs and exact dispatch authorization
        shell: bash
        env:
          EXECUTION_AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == 'main' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]]
          [[ "$EXECUTION_AUTHORIZATION" == 'EXECUTE_CONTA_FIRST_PRODUCTION_A6B94702' ]]
          [[ -n "${DS_SFTP_USER:-}" ]]
          [[ -n "${DS_SFTP_VALUE:-}" ]]
          [[ -n "${CONTA_PROD_API_KEY:-}" ]]
          [[ -n "${CONTA_PROD_ORG_ID:-}" ]]
          [[ -n "${CONTA_PROD_CUSTOMER_REFERENCE:-}" ]]
          [[ -n "${CONTA_PROD_VAT_CODE:-}" ]]
          [[ -n "${CONTA_PROD_INVOICE_DATE:-}" ]]
          echo 'FIRST_PRODUCTION_EXECUTION_DISPATCH_BOUND=true'
          echo 'MAX_PROVIDER_MUTATIONS=1'
          echo 'AUTOMATIC_RETRY_ALLOWED=false'

      - name: Install protected execution runtime
        run: python -m pip install 'paramiko==5.0.0' 'certifi==2026.7.22'

      - name: Execute through deployed MCP runtime and re-close controls
        shell: bash
        run: >-
          python scripts/execute_conta_first_production_invoice_draft.py
          --authorization '${{ inputs.authorization }}'
          --decision-packet-sha256 '${{ inputs.decision_packet_sha256 }}'
          --decision-packet-expires-at '${{ inputs.decision_packet_expires_at }}'
