name: Remote D-R4B HTTP-forward preflight

on:
  workflow_dispatch:
  push:
    branches:
      - remote/d-r4b-http-forward-preflight-run
    paths:
      - .github/remote-triggers/d-r4b-http-forward-preflight

permissions:
  contents: read

concurrency:
  group: d-r4b-http-forward-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: domeneshop-readonly-validation

    steps:
      - name: Checkout accepted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Enforce GET-only remote preflight gates
        shell: bash
        env:
          DS_AUTH_USER: ${{ secrets.DS_AUTH_USER }}
          DS_AUTH_VALUE: ${{ secrets.DS_AUTH_VALUE }}
          DS_PILOT_DOMAIN_NAME: ${{ secrets.DS_PILOT_DOMAIN_NAME }}
          WRITE_TOOLS_ENABLED: ${{ vars.WRITE_TOOLS_ENABLED }}
          DRY_RUN_DEFAULT: ${{ vars.DRY_RUN_DEFAULT }}
          REQUIRE_OPERATOR_APPROVAL: ${{ vars.REQUIRE_OPERATOR_APPROVAL }}
        run: |
          set -euo pipefail
          [[ -n "${DS_AUTH_USER:-}" ]]
          [[ -n "${DS_AUTH_VALUE:-}" ]]
          [[ "$DS_PILOT_DOMAIN_NAME" == "atlas-mcp-sandbox.no" ]]
          [[ "$WRITE_TOOLS_ENABLED" == "false" ]]
          [[ "$DRY_RUN_DEFAULT" == "true" ]]
          [[ "$REQUIRE_OPERATOR_APPROVAL" == "true" ]]

      - name: Install read-only runtime
        run: python -m pip install -e ".[test]"

      - name: Verify repository and controlled-write hold
        run: |
          python scripts/validate_repository_structure.py
          python scripts/validate_controlled_write_foundation.py

      - name: Run authenticated GET-only HTTP-forward preflight
        env:
          DS_AUTH_USER: ${{ secrets.DS_AUTH_USER }}
          DS_AUTH_VALUE: ${{ secrets.DS_AUTH_VALUE }}
          DS_PILOT_DOMAIN_NAME: ${{ secrets.DS_PILOT_DOMAIN_NAME }}
          DS_PILOT_FORWARD_HOST: mcp-forward-validation
          WRITE_TOOLS_ENABLED: ${{ vars.WRITE_TOOLS_ENABLED }}
          DRY_RUN_DEFAULT: ${{ vars.DRY_RUN_DEFAULT }}
          REQUIRE_OPERATOR_APPROVAL: ${{ vars.REQUIRE_OPERATOR_APPROVAL }}
        run: python scripts/http_forward_pilot_preflight.py
