name: Validate protected Domeneshop read-only environment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domeneshop-protected-readonly-validation
  cancel-in-progress: false

jobs:
  validate-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: domeneshop-readonly-validation
    env:
      DS_AUTH_USER: ${{ secrets.DS_AUTH_USER }}
      DS_AUTH_VALUE: ${{ secrets.DS_AUTH_VALUE }}
      DS_SFTP_USER: ${{ secrets.DS_SFTP_USER }}
      DS_SFTP_VALUE: ${{ secrets.DS_SFTP_VALUE }}
      DS_STATUS_URL: ${{ vars.DS_STATUS_URL }}
      DS_STATUS_AUTH_USER: ${{ secrets.DS_STATUS_AUTH_USER }}
      DS_STATUS_AUTH_VALUE: ${{ secrets.DS_STATUS_AUTH_VALUE }}
      WRITE_TOOLS_ENABLED: ${{ vars.WRITE_TOOLS_ENABLED }}
      DRY_RUN_DEFAULT: ${{ vars.DRY_RUN_DEFAULT }}
      REQUIRE_OPERATOR_APPROVAL: ${{ vars.REQUIRE_OPERATOR_APPROVAL }}
      REQUIRE_BACKUP_EVIDENCE: ${{ vars.REQUIRE_BACKUP_EVIDENCE }}
      REQUIRE_PREFLIGHT_REPORT: ${{ vars.REQUIRE_PREFLIGHT_REPORT }}

    steps:
      - name: Checkout accepted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Enforce credential and fail-closed configuration gates
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DS_AUTH_USER DS_AUTH_VALUE DS_SFTP_USER DS_SFTP_VALUE DS_STATUS_AUTH_USER DS_STATUS_AUTH_VALUE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing protected environment secret::$name is not configured."
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]
          [[ "$DS_STATUS_URL" == "https://ds.atlas-ai.no/" ]]
          [[ "$WRITE_TOOLS_ENABLED" == "false" ]]
          [[ "$DRY_RUN_DEFAULT" == "true" ]]
          [[ "$REQUIRE_OPERATOR_APPROVAL" == "true" ]]
          [[ "$REQUIRE_BACKUP_EVIDENCE" == "true" ]]
          [[ "$REQUIRE_PREFLIGHT_REPORT" == "true" ]]

      - name: Install read-only runtime
        run: python -m pip install -e ".[server,sftp,test]"

      - name: Verify repository and controlled-write hold
        run: |
          python scripts/validate_repository_structure.py
          python scripts/validate_controlled_write_foundation.py

      - name: Verify MCP stdio and read-only tool discovery
        run: python -m pytest tests/test_mcp_stdio_smoke.py -q

      - name: Validate authenticated Domeneshop API read
        run: python scripts/domeneshop_read_smoke.py

      - name: Validate authenticated protected status GET
        run: python scripts/protected_status_smoke.py

      - name: Validate authenticated SFTP read
        run: python scripts/remote_read_smoke.py
