name: Deploy authorized Conta fail-closed candidate

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type AUTHORIZE_CONTA_FAIL_CLOSED_DEPLOYMENT_7D97A633
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conta-fail-closed-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Back up and deploy exact protected-runtime candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: domeneshop-readonly-validation
    env:
      DEPLOYMENT_AUTHORIZATION: ${{ inputs.authorization }}
      DS_SFTP_USER: ${{ secrets.DS_SFTP_USER }}
      DS_SFTP_VALUE: ${{ secrets.DS_SFTP_VALUE }}
      WRITE_TOOLS_ENABLED: ${{ vars.WRITE_TOOLS_ENABLED }}
      DRY_RUN_DEFAULT: ${{ vars.DRY_RUN_DEFAULT }}
      REQUIRE_OPERATOR_APPROVAL: ${{ vars.REQUIRE_OPERATOR_APPROVAL }}
      REQUIRE_BACKUP_EVIDENCE: ${{ vars.REQUIRE_BACKUP_EVIDENCE }}
      REQUIRE_PREFLIGHT_REPORT: ${{ vars.REQUIRE_PREFLIGHT_REPORT }}

    steps:
      - name: Checkout deployment control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout immutable Conta candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nanotech-solutions-norway/Conta-MCP
          ref: 7d97a6330e4aff5a6e251ad19d717d7408cf3825
          path: candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Enforce exact authorization and fail-closed gates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_AUTHORIZATION" == "AUTHORIZE_CONTA_FAIL_CLOSED_DEPLOYMENT_7D97A633" ]]
          [[ "$GITHUB_REF_NAME" == "main" ]]
          [[ -n "${DS_SFTP_USER:-}" ]]
          [[ -n "${DS_SFTP_VALUE:-}" ]]
          [[ "$WRITE_TOOLS_ENABLED" == "false" ]]
          [[ "$DRY_RUN_DEFAULT" == "true" ]]
          [[ "$REQUIRE_OPERATOR_APPROVAL" == "true" ]]
          [[ "$REQUIRE_BACKUP_EVIDENCE" == "true" ]]
          [[ "$REQUIRE_PREFLIGHT_REPORT" == "true" ]]
          echo "DEPLOYMENT_AUTHORIZATION_BOUND=true"
          echo "PRODUCTION_PROVIDER_MUTATION_AUTHORIZED=false"
          echo "PRODUCTION_WRITE_AUTHORIZED=false"

      - name: Install SFTP runtime
        run: python -m pip install "paramiko==5.0.0"

      - name: Back up, deploy, and verify exact candidate
        shell: bash
        run: >-
          python scripts/deploy_conta_fail_closed.py
          --candidate-root candidate
          --run-token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
