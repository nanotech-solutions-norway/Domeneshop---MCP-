name: D-R4B HTTP-forward CREATE dry-run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/remote-triggers/d-r4b-http-forward-create-dry-run

permissions:
  contents: read

concurrency:
  group: d-r4b-http-forward-create-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout accepted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: python -m pip install -e ".[test]"

      - name: Verify exact non-mutating binding
        env:
          WRITE_TOOLS_ENABLED: "false"
          DRY_RUN_DEFAULT: "true"
        run: |
          python -m pytest -q tests/test_http_forward_create_dry_run.py
          python scripts/http_forward_d_r4b_create_dry_run.py
