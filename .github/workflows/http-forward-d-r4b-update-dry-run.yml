name: D-R4B HTTP-forward UPDATE dry-run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/http-forward-d-r4b-update-dry-run.yml
      - src/domeneshop_mcp/http_forward_update_dry_run.py
      - scripts/http_forward_d_r4b_update_dry_run.py
      - tests/test_http_forward_update_dry_run.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout accepted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime and test exact UPDATE dry-run
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_http_forward_update_dry_run.py

      - name: Run deterministic UPDATE dry-run
        env:
          WRITE_TOOLS_ENABLED: "false"
          DRY_RUN_DEFAULT: "true"
          HTTP_FORWARD_D_R4B_CREATE_AUTHORIZED: "false"
          HTTP_FORWARD_D_R4B_UPDATE_AUTHORIZED: "false"
          HTTP_FORWARD_D_R4B_DELETE_AUTHORIZED: "false"
          HTTP_FORWARD_D_R4B_BROADER_OVERWRITE_AUTHORIZED: "false"
        run: python scripts/http_forward_d_r4b_update_dry_run.py
