name: Atlas-AI database dependency audit

on:
  pull_request:
    paths:
      - '.github/workflows/atlas-ai-database-dependency-audit.yml'
      - 'scripts/audit_atlas_ai_database_dependency.py'
      - '.github/remote-triggers/atlas-ai-database-dependency-audit'
  push:
    branches:
      - main
    paths:
      - '.github/remote-triggers/atlas-ai-database-dependency-audit'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ai-database-dependency-audit
  cancel-in-progress: false

jobs:
  validate:
    name: Validate read-only database dependency auditor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/audit_atlas_ai_database_dependency.py
      - shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DIRECT_DATABASE_CONNECTION_PERFORMED": False' scripts/audit_atlas_ai_database_dependency.py
          grep -Fq 'DATABASE_QUERY_PERFORMED": False' scripts/audit_atlas_ai_database_dependency.py
          grep -Fq 'REMOTE_FILE_WRITE_PERFORMED": False' scripts/audit_atlas_ai_database_dependency.py
          grep -Fq 'PROVIDER_MUTATION_PERFORMED": False' scripts/audit_atlas_ai_database_dependency.py
          ! grep -Eqi '\b(INSERT|UPDATE|DELETE|DROP|ALTER|TRUNCATE|REPLACE)\b' scripts/audit_atlas_ai_database_dependency.py
          ! grep -Eq 'method="(POST|PUT|PATCH|DELETE)"' scripts/audit_atlas_ai_database_dependency.py
          ! grep -Eq "method='(POST|PUT|PATCH|DELETE)'" scripts/audit_atlas_ai_database_dependency.py
          echo 'READ_ONLY_DATABASE_DEPENDENCY_AUDITOR_VALIDATED=true'

  audit:
    name: Audit live Atlas-AI database dependencies
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: domeneshop-readonly-validation
    env:
      DS_SFTP_USER: ${{ secrets.DS_SFTP_USER }}
      DS_SFTP_VALUE: ${{ secrets.DS_SFTP_VALUE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'paramiko==5.0.0' 'certifi==2026.7.22'
      - shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == 'main' ]]
          [[ -n "${DS_SFTP_USER:-}" ]]
          [[ -n "${DS_SFTP_VALUE:-}" ]]
          python scripts/audit_atlas_ai_database_dependency.py
