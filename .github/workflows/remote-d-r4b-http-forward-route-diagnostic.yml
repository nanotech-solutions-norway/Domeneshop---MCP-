name: Remote D-R4B HTTP-forward route diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/remote-triggers/d-r4b-http-forward-route-diagnostic

permissions:
  contents: read

concurrency:
  group: d-r4b-http-forward-route-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: domeneshop-readonly-validation

    steps:
      - name: Checkout accepted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Enforce GET-only diagnostic gates
        shell: bash
        env:
          DS_AUTH_USER: ${{ secrets.DS_AUTH_USER }}
          DS_AUTH_VALUE: ${{ secrets.DS_AUTH_VALUE }}
          WRITE_TOOLS_ENABLED: ${{ vars.WRITE_TOOLS_ENABLED }}
          DRY_RUN_DEFAULT: ${{ vars.DRY_RUN_DEFAULT }}
        run: |
          set -euo pipefail
          [[ -n "${DS_AUTH_USER:-}" ]]
          [[ -n "${DS_AUTH_VALUE:-}" ]]
          [[ "$WRITE_TOOLS_ENABLED" == "false" ]]
          [[ "$DRY_RUN_DEFAULT" == "true" ]]

      - name: Install runtime and test diagnostic
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_http_forward_route_diagnostic.py

      - name: Run GET-only single-host route diagnostic
        env:
          DS_AUTH_USER: ${{ secrets.DS_AUTH_USER }}
          DS_AUTH_VALUE: ${{ secrets.DS_AUTH_VALUE }}
          WRITE_TOOLS_ENABLED: "false"
          DRY_RUN_DEFAULT: "true"
          HTTP_FORWARD_D_R4B_CREATE_AUTHORIZED: "false"
          HTTP_FORWARD_D_R4B_UPDATE_AUTHORIZED: "false"
          HTTP_FORWARD_D_R4B_DELETE_AUTHORIZED: "false"
          HTTP_FORWARD_D_R4B_BROADER_OVERWRITE_AUTHORIZED: "false"
        run: python scripts/http_forward_route_diagnostic.py
